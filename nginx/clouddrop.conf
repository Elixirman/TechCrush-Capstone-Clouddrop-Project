# 3. Test config: sudo nginx -t
# 4. Reload: sudo systemctl reload nginx
# 5. Add HTTPS: run certbot (Let's Encrypt) once you have a domain or use an ALB with ACM instead

server {
    listen 80;
    server_name _;  # TODO(Member A): replace with your EC2 public IP or domain

    location / {
        proxy_pass http://127.0.0.1:5000;   # Gunicorn/Flask running locally on the instance
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:5000/health;
        access_log off;
    }
}
